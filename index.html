<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mis Imágenes</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: #f2f2f2;
      padding: 30px 15px;
    }

    .contenedor {
      max-width: 500px;
      margin: auto;
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 2px 10px #ccc;
    }

    h1 {
      color: #333;
    }

    input, button {
      width: 100%;
      padding: 12px;
      margin-top: 12px;
      box-sizing: border-box;
      border-radius: 8px;
      border: 1px solid #ccc;
    }

    button {
      background: #222;
      color: white;
      border: none;
      font-size: 16px;
    }

    button:active {
      transform: scale(0.98);
    }

    #resultado {
      margin-top: 20px;
      word-break: break-all;
    }

    img {
      max-width: 100%;
      margin-top: 15px;
      border-radius: 10px;
    }
  </style>
</head>

<body>

  <div class="contenedor">

    <h1>📷 Mis Imágenes</h1>

    <p>Selecciona una imagen de tu teléfono.</p>

    <input type="file" id="imagen" accept="image/*">

    <button onclick="mostrarImagen()">
      Mostrar imagen
    </button>

    <div id="resultado"></div>

  </div>

  <script>
    function mostrarImagen() {

      const archivo = document.getElementById("imagen").files[0];
      const resultado = document.getElementById("resultado");

      if (!archivo) {
        resultado.innerHTML = "⚠️ Selecciona una imagen primero.";
        return;
      }

      const lector = new FileReader();

      lector.onload = function(e) {

        resultado.innerHTML = `
          <p>✅ Imagen seleccionada:</p>
          <img src="${e.target.result}">
          <p>Nombre: ${archivo.name}</p>
        `;

      };

      lector.readAsDataURL(archivo);
    }
  </script>

</body>
</html>
